name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python tools/build_cli_bundle.py
      - name: Verify bundled backend
        run: ./dist-cli/codex-relay --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos-backend
          path: dist-cli/codex-relay

  build-macos-app:
    needs: build-backend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-backend
          path: dist-cli
      - name: Build SwiftUI app with embedded backend
        env:
          CODEX_RELAY_GUI_APP: ${{ runner.temp }}/Codex Relay.app
          CODEX_RELAY_OPEN_AFTER: "0"
        run: |
          cd desktop
          ./build.sh
          test -x "$RUNNER_TEMP/Codex Relay.app/Contents/Resources/codex-relay"
          "$RUNNER_TEMP/Codex Relay.app/Contents/Resources/codex-relay" --version
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Codex Relay.app" "$RUNNER_TEMP/CodexRelay-${GITHUB_REF_NAME}-macOS-SwiftUI.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/CodexRelay-*-macOS-SwiftUI.zip

  publish:
    needs: [build-macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: release-assets
      - name: Flatten release assets
        run: |
          find release-assets -type f -exec cp {} release-assets/ \;
      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
