name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps -w dist-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-wheel
          path: dist-cli/*.whl

  build-tk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install pyinstaller
      - run: python tools/build_portable.py
      - name: Package Tk artifact
        shell: python
        run: |
          import os, pathlib, shutil, sys, zipfile
          root = pathlib.Path("dist")
          out = pathlib.Path("release"); out.mkdir(exist_ok=True)
          ref = os.environ["GITHUB_REF_NAME"]
          if sys.platform == "win32":
              name = f"CodexRelay-{ref}-Windows-x86_64.exe"
              shutil.copy2(root / "CodexRelay.exe", out / name)
          elif sys.platform == "darwin":
              name = f"CodexRelay-{ref}-macOS-arm64"
              shutil.copy2(root / "CodexRelay", out / name)
              with zipfile.ZipFile(out / f"CodexRelay-{ref}-macOS-arm64.app.zip", "w", zipfile.ZIP_DEFLATED) as z:
                  for item in (root / "CodexRelay.app").rglob("*"):
                      z.write(item, item.relative_to(root))
          else:
              name = f"CodexRelay-{ref}-Linux-x86_64"
              shutil.copy2(root / "CodexRelay", out / name)
      - uses: actions/upload-artifact@v4
        with:
          name: tk-${{ matrix.os }}
          path: release/*

  build-macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI app
        env:
          CODEX_RELAY_GUI_APP: ${{ runner.temp }}/Codex Relay.app
          CODEX_RELAY_OPEN_AFTER: "0"
        run: |
          cd desktop
          ./build.sh
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Codex Relay.app" "$RUNNER_TEMP/CodexRelay-${GITHUB_REF_NAME}-macOS-SwiftUI.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/CodexRelay-*-macOS-SwiftUI.zip

  publish:
    needs: [build-cli, build-tk, build-macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten release assets
        run: |
          find release-assets -type f -exec cp {} release-assets/ \;
      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
