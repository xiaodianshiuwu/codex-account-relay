name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release tag and tests
        env:
          CODEX_RELAY_TEST_MODE: "1"
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]
          test "$(uname -m)" = arm64
          python -c 'import os; from codex_relay import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__'
          python tests/run.py
          python tools/build_strings.py --check
          python tools/i18n_audit.py --json
          swift test --package-path desktop
      - name: Build persistent embedded runtime
        run: |
          python -m pip install --upgrade pip pyinstaller
          python tools/build_cli_bundle.py
          python tools/smoke_bundle.py dist-cli/codex-relay/codex-relay
      - name: Build and verify packaged app
        env:
          CODEX_RELAY_BUILD_DIR: ${{ runner.temp }}/relay-build
          CODEX_RELAY_OPEN_AFTER: "0"
          CODEX_RELAY_HOME: ${{ runner.temp }}/relay-smoke
          CODEX_HOME: ${{ runner.temp }}/codex-smoke
          CODEX_RELAY_PREFS_SUITE: io.codexrelay.ci
          CODEX_RELAY_TEST_MODE: "1"
        run: |
          ./desktop/build.sh
          APP="$CODEX_RELAY_BUILD_DIR/Codex Relay.app"
          "$APP/Contents/Resources/codex-relay" --version
          "$APP/Contents/MacOS/CodexRelay" --self-test
          "$APP/Contents/MacOS/CodexRelay" --i18n-self-test
          python tools/smoke_bundle.py "$APP/Contents/Resources/codex-relay"
          codesign --verify --deep --strict "$APP"
          mkdir -p "$RUNNER_TEMP/release-assets"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/release-assets/CodexRelay-${GITHUB_REF_NAME}-macOS-SwiftUI.zip"
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 CodexRelay-*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/release-assets/*
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-assets/*
          generate_release_notes: true
