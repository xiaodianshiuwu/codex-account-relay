name: internal-tests

on:
  push:
    paths:
      - "codex_relay/**"
      - "tests/**"
      - "desktop/**"
      - "pyproject.toml"
      - "setup.py"
      - "tools/**"
      - ".github/workflows/cross-platform.yml"
  pull_request:
    paths:
      - "codex_relay/**"
      - "tests/**"
      - "desktop/**"
      - "pyproject.toml"
      - "setup.py"
      - "tools/**"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test core and CLI
        env:
          CODEX_RELAY_TEST_MODE: "1"
        run: python tests/run.py
      - name: Install Python package
        run: python -m pip install .
      - name: Swift tests
        run: swift test --package-path desktop
      - name: Build SwiftUI app
        env:
          CODEX_RELAY_GUI_APP: ${{ runner.temp }}/Codex Relay.app
          CODEX_RELAY_OPEN_AFTER: "0"
        run: |
          cd desktop
          ./build.sh
          test -x "$RUNNER_TEMP/Codex Relay.app/Contents/MacOS/CodexRelay"
